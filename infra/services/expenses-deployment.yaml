apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenses
  labels:
    app: expenses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expenses
  template:
    metadata:
      labels:
        app: expenses
    spec:
      containers:
        - name: expenses
          image: localhost/expenses:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
            - containerPort: 8101
          env:
            - name: ASPNETCORE_HTTP_PORTS
              valueFrom:
                configMapKeyRef:
                  name: expenses-env
                  key: ASPNETCORE_HTTP_PORTS
            - name: ASPNETCORE_HTTPS_PORTS
              valueFrom:
                configMapKeyRef:
                  name: expenses-env
                  key: ASPNETCORE_HTTPS_PORTS
            - name: APP_DATA_PROTECTION_KEY_PATH
              valueFrom:
                configMapKeyRef:
                  name: expenses-env
                  key: APP_DATA_PROTECTION_KEY_PATH
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: expenses-env
                  key: CLIENT_ID
            - name: DATABASE
              valueFrom:
                configMapKeyRef:
                  name: expenses-env
                  key: DATABASE
            - name: ISSUER
              valueFrom:
                configMapKeyRef:
                  name: expenses-env
                  key: ISSUER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_PASSWORD
            - name: USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_USERNAME
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_PASSWORD
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /app/https/localhost.pfx
          volumeMounts:
            - name: app-certs
              mountPath: /app/https
              readOnly: true
            - name: keys
              mountPath: /app/keys
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: app-certs
          secret:
            secretName: app-certs
        - name: app-secrets
          secret:
            secretName: app-secrets
        - name: keys
          persistentVolumeClaim:
            claimName: keys-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: expenses
spec:
  selector:
    app: expenses
  ports:
    - name: http
      port: 8001
      targetPort: 8001
    - name: https
      port: 8101
      targetPort: 8101
