apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels:
    app: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: notifications
          image: localhost/notifications:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
            - containerPort: 8102
          env:
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: notifications-env
                  key: ASPNETCORE_URLS
            - name: USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_USERNAME
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_PASSWORD
            - name: ASPNETCORE_Kestrel__Certificates__Default__Password
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: APP_PASSWORD
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /app/https/localhost.pfx
          volumeMounts:
            - name: app-certs
              mountPath: /app/https
              readOnly: true
            - name: keys
              mountPath: /app/keys
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: app-certs
          secret:
            secretName: app-certs
        - name: app-secrets
          secret:
            secretName: app-secrets
        - name: keys
          persistentVolumeClaim:
            claimName: keys-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  selector:
    app: notifications
  ports:
    - name: http
      port: 8002
      targetPort: 8002
    - name: https
      port: 8102
      targetPort: 8102
