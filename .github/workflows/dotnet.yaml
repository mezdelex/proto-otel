name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10
      - name: Build Expenses
        run: dotnet build ./src/Services/Expenses/Expenses.slnx
      - name: Build Notifications
        run: dotnet build ./src/Services/Notifications/Notifications.slnx
      - name: Test
        run: dotnet test ./tests/Tests.slnx -v q
